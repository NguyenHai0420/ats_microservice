server:
    port: 8083

service:
    name: application-service
    description: Application Service
    version: 1.0.0

spring:
    application:
        name: application-service
    datasource:
        url: jdbc:postgresql://localhost:5432/application_sdb
        driver-class-name: org.postgresql.Driver
        username: postgres
        password: haicoi2004
    jpa:
        hibernate:
            ddl-auto: update
            naming:
                physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
            properties:
                hibernate:
                    format_sql: true
                    dialect: org.hibernate.dialect.PostgreSQLDialect

# Feign client configuration
spring.cloud.openfeign:
    circuitbreaker:
        enabled: true
    client:
        config:
            default:
                connect-timeout: 5000
                read-timeout: 5000

eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8761/eureka/
            register-with-eureka: true
            fetch-registry: true
    instance:
        prefer-ip-address: true    # Dùng IP thay hostname - quan trọng trong Docker
        lease-renewal-interval-in-seconds: 10   # Heartbeat mỗi 10s (dev)
        lease-expiration-duration-in-seconds: 30  # Expiry sau 30s không có heartbeat

management:
    endpoints:
        web:
            exposure:
                include: health,info,env