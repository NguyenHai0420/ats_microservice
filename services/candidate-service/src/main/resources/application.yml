server:
    port: 8082
spring:
  application:
    name: candidate-service
  datasource:
    url: jdbc:postgresql://localhost:5432/candidate_sdb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: haicoi2004
  jpa:
      hibernate:
        ddl-auto: update
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
      register-with-eureka: true
      fetch-registry: true
      instance:
        prefer-ip-address: true    # Dùng IP thay hostname - quan trọng trong Docker
        lease-renewal-interval-in-seconds: 10   # Heartbeat mỗi 10s (dev)
        lease-expiration-duration-in-seconds: 30  # Expiry sau 30s không có heartbeat

  management:
    endpoints:
      web:
        exposure:
          include: health,info,env