service:
    name: job-service
    description: Job Service
    version: 1.0.0
    port: 8081

spring:
    application:
        name: job-service
    datasource:
        url: jdbc:postgresql://localhost:5432/job_sdb
        driver-class-name: org.postgresql.Driver
        username: postgres
        password: haicoi2004
    jpa:
        hibernate:
            ddl-auto: update
            naming:
                physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
            properties:
                hibernate:
                    format_sql: true
                    dialect: org.hibernate.dialect.PostgreSQLDialect